<style>
/* Layout: one-screen app — compact header, full-bleed photo card with overlaid info, floating action row, pill tab bar */
:root{
  --bg:#F4F2F7; --surface:#FFFFFF; --soft:#ECE9F1; --ink:#16141C; --muted:#75707F; --line:#E2DEE8;
  --a1:#FF9A3C; --a2:#FF5E3A; --a3:#E8335A; --accent:#FF5E3A; --on-accent:#FFFFFF;
  --good:#16B07A; --bad:#F0445C; --sea:#D7E8F4; --seaEdge:#BCD6EA; --landc:#F6F0E4; --coast:#B4A387;
  --shadow:0 18px 40px -12px rgba(40,20,60,.28);
  --font:"Plus Jakarta Sans","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E13; --surface:#1B1A21; --soft:#24222B; --ink:#F3F1F7; --muted:#9C97A6; --line:#2E2C36;
  --shadow:0 18px 40px -12px rgba(0,0,0,.7); --sea:#132232; --seaEdge:#1C3248; --landc:#2A2D34; --coast:#545B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E13; --surface:#1B1A21; --soft:#24222B; --ink:#F3F1F7; --muted:#9C97A6; --line:#2E2C36;
  --shadow:0 18px 40px -12px rgba(0,0,0,.7); --sea:#132232; --seaEdge:#1C3248; --landc:#2A2D34; --coast:#545B6B; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo{width:36px;height:36px;flex:none}
.brand b{background:linear-gradient(90deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.count{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--soft);padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative;overflow:hidden;overflow:clip}
.app{overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.stack{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;touch-action:none;user-select:none;cursor:grab;will-change:transform;isolation:isolate}
.card.back{transform:scale(.94) translateY(14px);opacity:.75}
.card.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.photo{position:absolute;inset:0;display:grid;place-items:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%;pointer-events:none}
.photo svg{width:44%;max-width:190px;height:auto;margin-top:-48%;opacity:.95}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,16,.92) 0%,rgba(10,8,16,.55) 38%,rgba(10,8,16,0) 62%);pointer-events:none}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.glass{background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);
  color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;white-space:nowrap}
.hot{background:linear-gradient(90deg,var(--a2),var(--a3));border:0}
.stamp{position:absolute;top:70px;font-weight:800;font-size:28px;letter-spacing:.02em;padding:6px 16px;border-radius:14px;opacity:0;color:#fff;text-transform:uppercase}
.stamp.yes{left:18px;background:var(--good);transform:rotate(-10deg)}
.stamp.no{right:18px;background:var(--bad);transform:rotate(10deg)}
.info{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff;display:flex;flex-direction:column;gap:10px}
.price{display:inline-flex;align-self:flex-start;align-items:baseline;gap:4px;background:#fff;color:#16141C;border-radius:14px;padding:6px 12px;
  font-weight:800;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price small{font-size:12px;font-weight:600;color:#75707F}
.info h2{margin:0;font-size:25px;font-weight:800;line-height:1.12;letter-spacing:-.025em;text-wrap:balance}
.desc{margin:0;line-height:1.45;font-size:14px;color:rgba(255,255,255,.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.chip svg{width:14px;height:14px}
.actions{display:flex;justify-content:center;align-items:center;gap:16px;padding-block:16px 12px}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 22px -6px rgba(40,20,60,.25);color:var(--ink);transition:transform .15s}
.fab.small{width:46px;height:46px;color:var(--muted)}
.fab.no{color:var(--bad)}
.fab.yes{width:70px;height:70px;background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));color:#fff;box-shadow:0 12px 26px -8px rgba(232,51,90,.6)}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px}.fab.small svg{width:20px;height:20px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--surface);border-radius:28px}
.empty h3{font-size:20px;color:var(--ink);margin:0 0 6px;letter-spacing:-.02em}
.primary{background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));color:#fff;border:0;border-radius:16px;padding:15px 18px;font:700 16px var(--font);cursor:pointer}
.ghost{background:var(--soft);border:0;color:var(--ink);border-radius:12px;padding:10px 16px;font:600 14px var(--font);cursor:pointer}
nav{display:flex;justify-content:space-around;gap:4px;background:var(--surface);border-radius:22px;padding:6px;margin-block:4px 10px;box-shadow:0 6px 20px -10px rgba(40,20,60,.25)}
nav button{flex:1;background:none;border:0;color:var(--muted);font:600 12px var(--font);display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:16px;cursor:pointer}
nav button svg{width:20px;height:20px;flex:none}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.scroll{overflow-y:auto;flex:1;padding-block:4px 16px}
.section-title{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.summary{background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));color:#fff;border-radius:22px;padding:18px;display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.summary span{font-size:12px;font-weight:600;opacity:.85}
.summary strong{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--surface);border-radius:18px}
.thumb{width:58px;height:58px;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:58%}
.row h4{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.row p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.row .rp{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.row .x{background:none;border:0;color:var(--muted);font:500 12px var(--font);cursor:pointer;padding:2px 0}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 15px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload{border:2px dashed var(--line);border-radius:20px;min-height:140px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;position:relative;overflow:hidden;background:var(--surface);padding:12px}
.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload .plus{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 8px;color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1em;font-weight:600}
/* people, ratings, reviews */
.st{color:#FFB400;letter-spacing:1px;white-space:nowrap}.st i{font-style:normal;color:var(--line)}
.who{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;padding:5px 12px 5px 5px;border-radius:999px;cursor:pointer;font:600 13px var(--font);align-self:flex-start}
.who .st i{color:rgba(255,255,255,.35)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none;letter-spacing:0}
.av.lg{width:76px;height:76px;font-size:26px}.av.md{width:46px;height:46px;font-size:16px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font:600 14px var(--font);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.prow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border-radius:18px;border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.prow h4{margin:0;font-size:15px;font-weight:700}.prow p{margin:3px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .r{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}.prow .r small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,8,16,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;box-sizing:border-box;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.close{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;clear:both}
.phead h2{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.025em}
.role{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.role.m{background:linear-gradient(90deg,var(--a1),var(--a3));color:#fff}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.pstats div{background:var(--surface);border-radius:16px;padding:12px 8px;text-align:center}
.pstats strong{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.pstats span{font-size:11.5px;color:var(--muted);font-weight:600}
.skills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.skills span{font-size:12.5px;font-weight:600;background:var(--surface);padding:6px 10px;border-radius:999px}
.bio{color:var(--muted);line-height:1.5;text-align:center;margin:10px auto 0;max-width:36ch}
.dist{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;margin-bottom:12px}
.dist .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.dist .big small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.bars{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:12px 1fr 20px;gap:6px;align-items:center}
.bar div{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.bar b{display:block;height:100%;background:#FFB400;border-radius:6px}
.h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.h3 small{font-size:12.5px;font-weight:600;color:var(--muted)}
.rev{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rev .hd{display:flex;gap:10px;align-items:center}.rev .hd div{min-width:0;flex:1}
.rev .nm{font-weight:700;font-size:14px}.rev .meta2{font-size:12px;color:var(--muted)}
.rev p{margin:0;line-height:1.5;font-size:14px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.rform{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rform textarea{background:var(--bg)}
.pick{display:flex;gap:4px}
.pick button{background:none;border:0;padding:2px;cursor:pointer;color:var(--line);font-size:34px;line-height:1}
.pick button.on{color:#FFB400}
.locbtn{display:flex;align-items:center;gap:6px;border:0;cursor:pointer;font:600 12.5px var(--font);color:var(--ink);background:var(--soft);padding:7px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.locbtn svg{width:15px;height:15px;color:var(--accent)}
.locbtn b{background:linear-gradient(90deg,var(--a1),var(--a3));color:#fff;border-radius:999px;padding:2px 7px;font-size:11.5px}
.map{background:var(--sea);border-radius:22px;overflow:hidden;aspect-ratio:1/1;max-width:100%;position:relative;margin-top:4px}
.map svg{display:block;width:100%;height:100%;touch-action:manipulation}
.land{fill:var(--landc);stroke:var(--coast);stroke-width:1.1;stroke-linejoin:round;fill-rule:evenodd}
.bord{fill:none;stroke:var(--coast);stroke-width:1;stroke-dasharray:4 3;opacity:.55}
.coasthalo{fill:none;stroke:var(--seaEdge);stroke-width:6;stroke-linejoin:round}
.lake{fill:var(--sea);stroke:var(--coast);stroke-width:.8}
.sloborder{fill:none;stroke:var(--coast);stroke-width:1.4;stroke-dasharray:5 4}
.ctry{fill:var(--muted);font-family:var(--font);font-weight:700;letter-spacing:.12em;opacity:.75}
.grid{stroke:var(--line);stroke-opacity:.6}
.rad{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
.tl{fill:var(--muted);font-family:var(--font);font-weight:600}
.pin{cursor:pointer}.pin.out{opacity:.28}
.mapctl{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.range{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.range strong{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input[type=range]{padding:0;height:28px;background:none;border:0;accent-color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:0;background:var(--surface);color:var(--ink);font:600 13px var(--font);padding:8px 12px;border-radius:999px;cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.found{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.found strong{font-size:20px;font-weight:800}
.near{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.near div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;background:var(--surface);border-radius:14px;padding:10px 12px}
.near span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg.mode{margin:0 0 10px}
.seg.mode button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.seg.mode svg{width:16px;height:16px}
.seg.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;flex:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{flex:none;border:0;background:var(--surface);color:var(--ink);font:600 13px var(--font);padding:8px 13px;border-radius:999px;cursor:pointer}
.chiprow button[aria-pressed="true"]{background:linear-gradient(90deg,var(--a1),var(--a3));color:#fff}
.pro .photo{place-items:start center}
.pro .bigav{position:absolute;top:16%;left:50%;transform:translateX(-50%);width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  font-size:46px;font-weight:800;color:#fff;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);letter-spacing:-.02em}
.pro .rate{display:flex;align-items:center;gap:8px;font-weight:700}
.quote{margin:0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.85);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.camrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cambtn{position:relative;flex-direction:row;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--ink);border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;overflow:hidden}
.cambtn.main{background:var(--ink);color:var(--bg)}
.cambtn svg{width:20px;height:20px}
.cambtn input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
.cambtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.upload{cursor:default}
.rmphoto{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,8,16,.6);color:#fff;font-size:20px;cursor:pointer;z-index:2}
.post{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.post .top2{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.post .thumb{width:64px;height:64px}
.post h4{margin:0;font-size:15.5px;font-weight:700}.post p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.status{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}

  el.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-x0;dy=e.clientY-y0;
    el.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/100));no.style.opacity=Math.max(0,Math.min(1,-dx/100))});

  if(!$("v-pros").hidden){if(e.key==="ArrowRight")$("m-yes").click();if(e.key==="ArrowLeft")$("m-no").click()}
  if(!$("v-hire").hidden){if(e.key==="ArrowRight")$("a-yes").click();if(e.key==="ArrowLeft")$("a-no").click()}
  if(!$("v-stud").hidden){if(e.key==="ArrowRight")$("s-yes").click();if(e.key==="ArrowLeft")$("s-no").click()}});

let selMode=false,confirmDel=false;const sel=new Set();
function renderMine(){const tk=allJobs().filter(j=>st.taken.includes(j.id));
  [...sel].forEach(id=>{if(!st.taken.includes(id))sel.delete(id)});
  if(!tk.length){selMode=false;confirmDel=false}
  if(!sel.size)confirmDel=false;
  const lo=tk.reduce((a,j)=>a+Number(j.min),0),hi=tk.reduce((a,j)=>a+Number(j.max),0);
  const selJobs=tk.filter(j=>sel.has(j.id)),sLo=selJobs.reduce((a,j)=>a+Number(j.min),0),sHi=selJobs.reduce((a,j)=>a+Number(j.max),0);
  $("mine").innerHTML=`<div class="mine-head"><h2 class="section-title">${t("myJobs")}</h2>
   ${tk.length?`<button class="ghost sm" id="selToggle" aria-pressed="${selMode}">${selMode?t("cancel"):t("selectJobs")}</button>`:""}</div>
  <div class="summary"><div><span>${t("jobsTaken")}</span><strong>${tk.length}</strong></div><div style="text-align:right"><span>${t("earnings")}</span><strong>${tk.length?range(lo,hi):money(0)}</strong></div></div>
  ${selMode?`<div class="selbar"><label class="chk"><input type="checkbox" id="selAll"${sel.size===tk.length?" checked":""}><span>${t("selectAll")}</span></label><span class="selcount">${t("selectedN",{n:sel.size})}</span></div>`:""}
  <div class="list">`+(tk.length?tk.map(j=>{const c=person(j.client),done=st.rated.includes(j.id),on=sel.has(j.id);
   return `<div class="row${selMode?" selectable":""}${on?" on":""}"${selMode?` data-sel="${j.id}"`:""}>
   ${selMode?`<label class="chk solo" aria-label="${esc(L(j.title))}"><input type="checkbox" data-cb="${j.id}"${on?" checked":""}></label>`:""}
   <div class="thumb" style="background:${cat(j).bg}">${art(j)}</div>
   <div style="min-width:0"><h4>${esc(L(j.title))}</h4><p>${esc(pName(c))} · ${esc(j.loc||"")}</p>
   ${selMode?"":`<button class="rate-btn" data-rate="${j.id}">${done?t("rated"):t("finishRate")}</button>`}</div>
   <div><div class="rp">${range(j.min,j.max)}</div>${selMode?"":`<button class="x" data-id="${j.id}">${t("remove")}</button>`}</div></div>`}).join("")
   :`<p style="color:var(--muted)">${t("noTaken")}</p>`)+`</div>
  ${selMode?`<div class="delbar">${confirmDel
    ?`<p>${t("confirmRemove",{x:nJobs(sel.size)})}<br><small>${t("loseEarn",{x:range(sLo,sHi)})}</small></p><div class="two"><button class="ghost" id="delNo">${t("cancel")}</button><button class="danger" id="delYes">${t("removeNow")}</button></div>`
    :`<button class="danger" id="delSel"${sel.size?"":" disabled"}>${sel.size?t("removeSelected",{n:sel.size}):t("pickToRemove")}</button>`}</div>`:""}`;
  const M=$("mine");
  M.querySelectorAll(".x").forEach(b=>b.onclick=()=>{st.taken=st.taken.filter(i=>i!==b.dataset.id);save();renderMine()});
  M.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{const j=jobById(b.dataset.rate);openProfile(j.client,{jobId:j.id,focus:!st.rated.includes(j.id)})});
  if($("selToggle"))$("selToggle").onclick=()=>{selMode=!selMode;sel.clear();confirmDel=false;renderMine()};
  if($("selAll"))$("selAll").onchange=e=>{sel.clear();if(e.target.checked)tk.forEach(j=>sel.add(j.id));confirmDel=false;renderMine()};
  const flip=id=>{sel.has(id)?sel.delete(id):sel.add(id);confirmDel=false;renderMine()};
  M.querySelectorAll("[data-cb]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>flip(cb.dataset.cb)});
  M.querySelectorAll("[data-sel]").forEach(r=>r.onclick=e=>{if(e.target.closest("label.chk"))return;flip(r.dataset.sel)});
  if($("delSel"))$("delSel").onclick=()=>{if(!sel.size)return;confirmDel=true;renderMine();const y=$("delYes");if(y)y.focus()};
  if($("delNo"))$("delNo").onclick=()=>{confirmDel=false;renderMine()};
  if($("delYes"))$("delYes").onclick=()=>{const n=sel.size;st.taken=st.taken.filter(i=>!sel.has(i));sel.clear();confirmDel=false;selMode=false;save();renderMine();toast(t("removedN",{x:nJobs(n)}))}}

/* ================= PROS (client mode) ================= */
const prosPending=()=>PEOPLE.filter(p=>p.role==="mojster"&&!st.doneM.includes(p.id)&&(st.proCat==="all"||p.cats.includes(st.proCat)))
  .map(p=>({p,d:distP(p),rt:rating(p.id)})).filter(x=>(x.d??0)<=st.radius)
  .sort((a,b)=>(b.rt.avg*Math.min(b.rt.n,5))-(a.rt.avg*Math.min(a.rt.n,5))||a.d-b.d).map(x=>x.p);
function proCard(p){const rt=rating(p.id),top=revsTo(p.id)[0],c=CATS[p.cats[0]];
  const ini=p.name.split(" ").map(w=>w[0]).join("").slice(0,2);return `
  <div class="photo" style="background:${c.bg}"><div class="bigav">${esc(ini)}</div></div><div class="shade"></div>
  <div class="top"><span class="glass">${esc(p.cats.map(catName).join(" · "))}</span>${rt.avg>=4.7&&rt.n>=3?`<span class="glass hot">${t("topPro")}</span>`:""}</div>
  <span class="stamp yes">${t("stampInvite")}</span><span class="stamp no">${t("stampNo")}</span>
  <div class="info">
   <div class="price">${t("fromRate",{x:money(p.rate)})} <small>${t("perHour")}</small></div>
   <h2>${esc(p.name)}</h2>
   <div class="rate">${rt.n?stars(rt.avg)+` ${f1(rt.avg)} <span style="opacity:.7;font-weight:500">(${nRev(rt.n)})</span>`:t("newPro")}</div>
   ${top?`<p class="quote">»${esc(L(top.text))}«</p>`:""}
   <div class="chips"><span class="chip">${IC.pin}${esc(p.loc)} · ${fkm(distP(p))}</span><span class="chip">${IC.box}${nJobs(p.jobs)}</span><span class="chip">${IC.clock}${t("since",{y:p.since})}</span></div>
  </div>`}
function renderPros(){
  $("catRow").innerHTML=[["all",t("all")],...Object.keys(CATS).map(k=>[k,catName(k)])].map(([k,n])=>`<button data-c="${k}" aria-pressed="${st.proCat===k}">${esc(n)}</button>`).join("");
  $("catRow").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.proCat=b.dataset.c;save();renderPros()});
  const p=prosPending(),stack=$("stackM");stack.innerHTML="";
  if(!p.length){const any=PEOPLE.some(x=>x.role==="mojster"&&!st.doneM.includes(x.id));
    stack.innerHTML=`<div class="empty"><div><h3>${t("noProsMatch")}</h3><p>${any?t("widenOrCat"):t("seenAll")}</p>
     <p>${any?`<button class="ghost" id="mWider">${t("widen")}</button>`:`<button class="ghost" id="mReset">${t("restart")}</button>`}</p></div></div>`;
    if($("mWider"))$("mWider").onclick=openMap;if($("mReset"))$("mReset").onclick=()=>{st.doneM=[];save();renderPros()};return}
  p.slice(0,2).reverse().forEach((m,i,arr)=>{const el=document.createElement("article");
    el.className="card pro"+(i<arr.length-1?" back":"");el.innerHTML=proCard(m);el.dataset.id=m.id;stack.appendChild(el);
    if(i===arr.length-1)swipeEl(el,r=>decideM(m,r),()=>openProfile(m.id))});
}
function decideM(m,right){st.doneM.push(m.id);st.lastM={id:m.id,right};
  if(right&&!st.invited.includes(m.id)){st.invited.push(m.id);toast(t("tInvited",{x:m.name}))}
  save();renderPros();renderPosts()}
const topM=()=>$("stackM").querySelector(".card:not(.back)");
$("m-yes").onclick=()=>{const el=topM();if(el)flyEl(el,true,r=>decideM(person(el.dataset.id),r))};
$("m-no").onclick=()=>{const el=topM();if(el)flyEl(el,false,r=>decideM(person(el.dataset.id),r))};
$("m-info").onclick=()=>{const el=topM();if(el)openProfile(el.dataset.id)};
$("m-undo").onclick=()=>{if(!st.lastM)return toast(t("tNothing"));
  st.doneM=st.doneM.filter(i=>i!==st.lastM.id);if(st.lastM.right)st.invited=st.invited.filter(i=>i!==st.lastM.id);
  st.lastM=null;save();renderPros();renderPosts()};

/* ================= MY POSTS ================= */
function applicants(j){const ll=coords(j)||TOWNS[st.home];
  return PEOPLE.filter(p=>p.role==="mojster"&&p.cats.includes(j.cat)&&TOWNS[p.loc])
    .map(p=>({p,d:km(ll,TOWNS[p.loc]),inv:st.invited.includes(p.id)})).filter(a=>a.inv||a.d<=Math.max(st.radius,40))
    .sort((a,b)=>b.inv-a.inv||a.d-b.d).slice(0,3)}
function renderPosts(){const mine=allJobs().filter(j=>j.client==="me"),inv=st.invited.map(person);
  $("posts").innerHTML=`<h2 class="section-title">${t("myPosts")}</h2>
  ${inv.length?`<div class="h3" style="margin-top:0">${t("invitedPros")} <small>${inv.length}</small></div><div class="list" style="margin-bottom:6px">${inv.map(p=>{const rt=rating(p.id);
    return `<button class="prow" data-person="${p.id}">${av(p,"md")}<div style="min-width:0"><h4>${esc(p.name)}${vBadge(p.id)}</h4><p>${esc(p.skills.map(s=>L(SKILLS[s])).join(" · "))}</p></div>
    <div class="r">${rt.n?f1(rt.avg):"–"} ${rt.n?stars(rt.avg):""}<small>${fkm(distP(p))}</small></div></button>`}).join("")}</div>`:""}
  <div class="h3"${inv.length?"":' style="margin-top:0"'}>${t("postedJobs")} <small>${mine.length}</small></div>
  <div class="list">${mine.length?mine.map(j=>{const ch=st.chosen[j.id]?person(st.chosen[j.id]):null,rated=st.rated.includes("c:"+j.id);
   return `<div class="post"><div class="top2"><div class="thumb" style="background:${cat(j).bg}">${art(j)}</div>
    <div style="min-width:0"><h4>${esc(L(j.title))}${j.example?`<span class="ex">${t("example")}</span>`:""}</h4><p>${esc(j.loc)} · ${esc(fmtQty(j))} · ${range(j.min,j.max)}</p></div>
    <span class="status${ch?" ok":""}">${ch?t("assigned"):t("collecting")}</span></div>
    <div class="apps">${ch?`<span class="lbl">${t("chosenPro")}</span>
      <div class="app-row">${av(ch)}<div><button class="nm" data-person="${ch.id}">${esc(ch.name)}</button><small>${stars(rating(ch.id).avg)} ${f1(rating(ch.id).avg)}</small></div>
      <button class="pick-btn" data-rate="${j.id}" data-m="${ch.id}"${rated?' style="opacity:.6"':""}>${rated?t("rated"):t("ratePro")}</button></div>`
     :(()=>{const a=applicants(j);return `<span class="lbl">${a.length?t("interested"):t("noInterested")}</span>`+a.map(({p,d,inv})=>{const rt=rating(p.id);
      return `<div class="app-row">${av(p)}<div><button class="nm" data-person="${p.id}">${esc(p.name)}</button>
       <small>${rt.n?stars(rt.avg)+" "+f1(rt.avg):t("newShort")} · ${fkm(d)}${inv?" · "+t("invitedShort"):""}</small></div><button class="pick-btn" data-pick="${j.id}" data-m="${p.id}">${t("choose")}</button></div>`}).join("")})()}
    </div><button class="x" data-del="${j.id}" style="align-self:flex-start">${t("removePost")}</button></div>`}).join("")
   :`<p style="color:var(--muted)">${t("noPosts")}</p>`}</div>`;
  const P=$("posts");
  P.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>openProfile(b.dataset.person));
  P.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{st.chosen[b.dataset.pick]=b.dataset.m;save();renderPosts();toast(t("tChosen",{x:person(b.dataset.m).name}))});
  P.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>openProfile(b.dataset.m,{jobId:"c:"+b.dataset.rate,focus:!st.rated.includes("c:"+b.dataset.rate)}));
  P.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(id==="my1")st.removedMy1=true;st.userJobs=st.userJobs.filter(j=>j.id!==id);delete st.chosen[id];save();renderPosts()})}

let segRole="mojster";
function renderPeople(){
  $("seg-m").setAttribute("aria-pressed",segRole==="mojster");$("seg-c").setAttribute("aria-pressed",segRole==="stranka");
  const list=PEOPLE.filter(p=>p.role===segRole&&p.id!=="me").map(p=>({p,rt:rating(p.id),d:distP(p)}))
    .sort((a,b)=>(a.d??0)-(b.d??0)).slice(0,60).sort((a,b)=>b.rt.avg-a.rt.avg||b.rt.n-a.rt.n);
  $("people").innerHTML=list.map(({p,rt,d})=>`<button class="prow" data-person="${p.id}">${av(p,"md")}
   <div style="min-width:0"><h4>${esc(p.name)}${vBadge(p.id)}</h4><p>${esc(p.role==="mojster"?p.skills.map(s=>L(SKILLS[s])).join(" · "):p.loc)} · ${fkm(d)}</p></div>
   <div class="r">${rt.n?f1(rt.avg):"–"} ${rt.n?stars(rt.avg):""}<small>${nRev(rt.n)}</small></div></button>`).join("");
  $("people").querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>openProfile(b.dataset.person))}
$("seg-m").onclick=()=>{segRole="mojster";renderPeople()};$("seg-c").onclick=()=>{segRole="stranka";renderPeople()};

/* ================= PROFILE SHEET ================= */
let sheetOpts={};
function openSheet(label){$("sheet").setAttribute("aria-label",label);$("sheetWrap").hidden=false}
function openProfile(id,opts={}){sheetOpts={...opts,id};drawProfile();openSheet(pName(person(id)));
  if(opts.focus)setTimeout(()=>{const x=$("rv-text");if(x){scrollToEl(x);x.focus()}},60)}
function closeSheet(){$("sheetWrap").hidden=true;sheetOpts={}}
$("sheetWrap").addEventListener("click",e=>{if(e.target.id==="sheetWrap")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetWrap").hidden)closeSheet()});
function revHTML(r,given){
  const other=given?person(r.to):(r.from==="me-m"?{id:"me-m",name:t("youAsPro"),role:"mojster"}:r.from==="me"?{id:"me",name:t("you"),role:"stranka"}:person(r.from));
  const tag=given?(other.role==="mojster"?t("aboutPro"):t("aboutClient")):(other.role==="mojster"?t("pro"):t("client"));
  return `<div class="rev"><div class="hd">${av(other)}<div><div class="nm">${esc(other.id==="me"&&given?t("yourProfile"):other.name||pName(other))}</div><div class="meta2">${fdate(r.date)}</div></div><span class="tag">${tag}</span></div>
   ${stars(r.stars)}<p>${esc(L(r.text))}</p></div>`}
function drawProfile(){
  const p=person(sheetOpts.id),rt=rating(p.id),rv=revsTo(p.id),isM=p.role==="mojster";
  const cnt=[5,4,3,2,1].map(s=>rv.filter(r=>r.stars===s).length),mx=Math.max(1,...cnt);
  const given=revsFrom(p.id),bio=p.id==="me"&&!p.bio?t("yourBio"):L(p.bio);
  $("sheet").innerHTML=`<div class="grab"></div><button class="close" id="cls" aria-label="${t("close")}">×</button>
  <div class="phead">${av(p,"lg")}<h2>${esc(pName(p))}${vBadge(p.id)}</h2>
   <span class="role ${isM?"m":""}">${isM?t("pro"):t("client")}${p.loc?" · "+esc(p.loc):""}${distP(p)!==null&&p.loc?" · "+fkm(distP(p)):""}</span>
   ${isM&&p.skills?`<div class="skills">${p.skills.map(s=>`<span>${esc(L(SKILLS[s]))}</span>`).join("")}</div>`:""}
   ${bio?`<p class="bio">${esc(bio)}</p>`:""}</div>
  <div class="pstats"><div><strong>${rt.n?f1(rt.avg):"–"}</strong><span>${t("rating")}</span></div>
   <div><strong>${isM?money(p.rate):num(p.jobs)}</strong><span>${isM?t("hourly"):t("jobsOrdered")}</span></div>
   <div><strong>${isM?num(p.jobs):p.since}</strong><span>${isM?t("jobsDone"):t("memberSince")}</span></div></div>
  ${rt.n?`<div class="dist"><div class="big">${f1(rt.avg)}<small>${stars(rt.avg)}<br>${nRev(rt.n)}</small></div>
   <div class="bars">${cnt.map((c,i)=>`<div class="bar"><span>${5-i}</span><div><b style="width:${c/mx*100}%"></b></div><span>${c}</span></div>`).join("")}</div></div>`:""}
  <div class="h3">${isM?t("whatClientsSay"):t("whatProsSay")} <small>${nRev(rt.n)}</small></div>
  <div class="list">${rv.length?rv.slice(0,30).map(r=>revHTML(r)).join(""):`<p style="color:var(--muted);margin:0">${t("noReviews")}</p>`}</div>
  ${given.length?`<div class="h3">${isM?t("givenToClients"):t("givenToPros")} <small>${given.length}</small></div>
   <div class="list">${given.slice(0,20).map(r=>revHTML(r,true)).join("")}</div>`:""}
  ${p.id!=="me"?`<div class="h3">${t("leaveReview")}</div>
  <form class="rform" id="rf" novalidate>
   <label>${t("reviewingAs")}<select id="rv-as"><option>${isM?t("asClient"):t("asPro")}</option></select></label>
   <div class="pick" id="pick" role="radiogroup" aria-label="${t("starCount")}">${[1,2,3,4,5].map(n=>`<button type="button" data-s="${n}" role="radio" aria-checked="false" aria-label="${t("starOf",{n})}">★</button>`).join("")}</div>
   <textarea id="rv-text" placeholder="${isM?t("revPhPro"):t("revPhClient")}" maxlength="400"></textarea>
   <div class="err" id="rv-err" role="alert"></div>
   <button class="primary" type="submit">${t("postReview")}</button></form>`:""}`;
  $("cls").onclick=closeSheet;
  if(p.id!=="me"){$("sheet").insertAdjacentHTML("beforeend",trustRow(p.id,"person",pName(p)));bindTrust(p.id,"person",pName(p))}
  const rf=$("rf");if(!rf)return;let pk=0;
  const paint=()=>$("pick").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",+b.dataset.s<=pk);b.setAttribute("aria-checked",+b.dataset.s===pk)});
  $("pick").querySelectorAll("button").forEach(b=>b.onclick=()=>{pk=+b.dataset.s;paint()});
  rf.onsubmit=e=>{e.preventDefault();const txt=$("rv-text").value.trim();
    const err=!pk?t("errStars"):txt.length<5?t("errText"):"";
    $("rv-err").textContent=err;if(err)return;
    st.myReviews.push({id:"r"+Date.now(),from:isM?"me":"me-m",to:p.id,stars:pk,text:txt,date:new Date().toISOString().slice(0,10),mine:true});
    revCache=null;
    if(sheetOpts.jobId&&!st.rated.includes(sheetOpts.jobId))st.rated.push(sheetOpts.jobId);
    if(sheetOpts.dealId){const dd=st.deals.find(x=>x.id===sheetOpts.dealId);if(dd){dd.status="rated";sysMsg(dd,"stRated")}}
    save();toast(t("tReview"));drawProfile();renderAll()};
}

/* ================= MAP & RADIUS ================= */
function proj(ll,c){return [(ll[1]-c[1])*111.32*Math.cos(c[0]*Math.PI/180),-(ll[0]-c[0])*110.57]}
function mapItems(all){const home=TOWNS[st.home];
  const hireView=st.mode==="zap";
  const src=st.mode==="stud"
    ?STUD.filter(a=>TOWNS[a.loc]&&(st.studCat==="all"||a.sec===st.studCat)).map(a=>({id:a.id,ll:TOWNS[a.loc],label:L(a.title)+" · "+coOf(a).name,color:secColor(a.sec)}))
    :hireView
    ?allAds().filter(a=>!st.doneA.includes(a.id)&&TOWNS[a.loc]&&(st.hireSec==="all"||a.sec===st.hireSec)).map(a=>({id:a.id,ll:TOWNS[a.loc],label:L(a.title)+" · "+coOf(a).name,color:secColor(a.sec)}))
    :st.mode==="stranka"
    ?PEOPLE.filter(p=>p.role==="mojster"&&TOWNS[p.loc]&&(st.proCat==="all"||p.cats.includes(st.proCat))).map(p=>({id:p.id,ll:TOWNS[p.loc],label:p.name+" · "+catName(p.cats[0]),color:catColor(p.cats[0])}))
    :allJobs().filter(j=>j.client!=="me"&&!st.done.includes(j.id)&&coords(j)).map(j=>({id:j.id,ll:coords(j),label:L(j.title)+" · "+j.loc,color:catColor(j.cat)}));
  src.forEach(it=>{it.d=km(home,it.ll);it.ok=it.d<=st.radius});
  return (all?src:src.filter(i=>i.ok)).sort((a,b)=>a.d-b.d)}
function mapSVG(){
  const c=TOWNS[st.home],S=Math.max(st.radius*2.5,24),h=S/2,fs=S/26,pr=S/42;
  const step=[2,5,10,20,25,50,100].find(s=>S/s<=6)||100;
  let g="";for(let v=Math.ceil(-h/step)*step;v<=h;v+=step)g+=`<line class="grid" x1="${v}" y1="${-h}" x2="${v}" y2="${h}" vector-effect="non-scaling-stroke"/><line class="grid" x1="${-h}" y1="${v}" x2="${h}" y2="${v}" vector-effect="non-scaling-stroke"/>`;
  const land=SLO.map(p=>proj(p,c).map(n=>n.toFixed(2)).join(",")).join(" ");
  const towns=townList().filter(n=>n!==st.home).map(n=>{const [x,y]=proj(TOWNS[n],c);
    return Math.abs(x)<h&&Math.abs(y)<h?`<circle cx="${x}" cy="${y}" r="${pr*.28}" fill="var(--muted)"/><text class="tl" x="${x+pr*.6}" y="${y-pr*.6}" font-size="${fs*.9}">${esc(n)}</text>`:""}).join("");

function processFile(f){
  if(!f.type.startsWith("image/")){toast(t("tImg"));return}
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,1000/Math.max(img.width,img.height));
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);setPhoto(c.toDataURL("image/jpeg",.8))};
    img.onerror=()=>toast(t("tImgErr"));img.src=r.result};
  r.readAsDataURL(f)}

function compressImg(file,max,cb){if(!file||!file.type.startsWith("image/")){toast(t("tImg"));return}
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.82))};
    img.onerror=()=>toast(t("tImgErr"));img.src=r.result};r.readAsDataURL(file)}
const has=(arr,v)=>arr.includes(v);
const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
const isPhone=s=>/^\+?[0-9 ()\/-]{6,20}$/.test(s);
const taxDigits=s=>String(s).replace(/^SI/i,"").replace(/\s/g,"");
function prChecks(p){const c=[["photo",!!p.photo],["name",!!(p.first&&p.last)],["email",isEmail(p.email)],["phone",!!p.phone],["town",!!p.town],["bio",p.bio.length>=20],["roles",p.roles.length>0]];
  if(has(p.roles,"pro"))c.push(["cats",p.cats.length>0],["rate",!!p.rate]);
  if(has(p.roles,"seeker"))c.push(["sectors",p.sectors.length>0],["edu",!!p.edu],["cv",!!p.cvName]);
  if(p.hasCo)c.push(["coName",!!p.co.name],["coTax",taxDigits(p.co.tax).length===8]);
  return c}
function prPct(p){const c=prChecks(p);return Math.round(c.filter(x=>x[1]).length/c.length*100)}
function prValidate(p){const e={};
  if(!p.first)e.first=t("eReq");if(!p.last)e.last=t("eReq");
  if(!p.email)e.email=t("eReq");else if(!isEmail(p.email))e.email=t("eEmail");
  if(p.phone&&!isPhone(p.phone))e.phone=t("ePhone");
  if(!p.town)e.town=t("eReq");
  if(p.rate&&!(Number(p.rate)>0))e.rate=t("eNum");
  if(p.hasCo){if(!p.co.name)e["co.name"]=t("eReq");
    const tx=taxDigits(p.co.tax);if(!tx)e["co.tax"]=t("eReq");else if(!/^\d{8}$/.test(tx))e["co.tax"]=t("eTax");
    const rg=String(p.co.reg).replace(/\s/g,"");if(rg&&!/^(\d{7}|\d{10})$/.test(rg))e["co.reg"]=t("eReg");
    if(p.co.web&&!/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(p.co.web))e["co.web"]=t("eWeb")}
  return e}

const fSel=(k,label,val,opts,o={})=>`<label><span>${label}${o.req?' <i class="req">*</i>':""}</span><select id="p-${k}" data-k="${k}">${o.blank?`<option value="">${esc(o.blank)}</option>`:""}${opts.map(([v,n])=>`<option value="${esc(v)}"${String(v)===String(val)?" selected":""}>${esc(n)}</option>`).join("")}</select>${err(k)}</label>`;
const fChips=(k,label,opts,sel)=>`<fieldset class="bens"><legend>${label}</legend><div class="benrow">${opts.map(([v,n])=>`<label class="benchip"><input type="checkbox" data-arr="${k}" value="${esc(v)}"${sel.includes(v)?" checked":""}><span>${esc(n)}</span></label>`).join("")}</div></fieldset>`;
const fTog=(k,label,on,desc="")=>`<label class="tog"><span><b>${label}</b>${desc?`<small>${desc}</small>`:""}</span><input type="checkbox" role="switch" data-tog="${k}"${on?" checked":""}><i aria-hidden="true"></i></label>`;
function avBig(src,initials,cls=""){return src?`<span class="pav ${cls}"><img src="${src}" alt=""></span>`:`<span class="pav ${cls} ph">${esc(initials||"?")}</span>`}
function getK(k){return k.startsWith("co.")?pd.co[k.slice(3)]:k.startsWith("prefs.")?pd.prefs[k.slice(6)]:pd[k]}
function setK(k,v){if(k.startsWith("co."))pd.co[k.slice(3)]=v;else if(k.startsWith("prefs."))pd.prefs[k.slice(6)]=v;else pd[k]=v}

function markDirty(){pdDirty=true;const d=$("dirtyTxt");if(d){d.textContent=t("unsaved");d.classList.add("on")}
  const pct=prPct(pd),bar=$("profile").querySelector(".pbar b"),miss=prChecks(pd).filter(x=>!x[1]).map(x=>t("ck_"+x[0]));
  if(bar){bar.style.width=pct+"%";bar.parentElement.setAttribute("aria-valuenow",pct)}
  const pt=$("pctTxt");if(pt)pt.textContent=t("completedPct",{n:pct})+(miss.length?" · "+t("missing")+": "+miss.slice(0,3).join(", ")+(miss.length>3?" …":""):"")}
function bindProfile(){const P=$("profile");bindVer();
  P.querySelectorAll("[data-legal]").forEach(b=>b.onclick=()=>openLegal(b.dataset.legal));if($("p-mydata"))$("p-mydata").onclick=openMyData;
  P.querySelectorAll("[data-unb]").forEach(b=>b.onclick=()=>{st.blocked=st.blocked.filter(x=>x!==b.dataset.unb);save();renderProfile();renderAll();toast(t("unblockedT",{x:""}).replace(/:\s*$/,""))});
  P.querySelectorAll("[data-k]").forEach(el=>{const ev=el.tagName==="SELECT"?"change":"input";el.addEventListener(ev,()=>{setK(el.dataset.k,el.value.trimStart());
    if(pdErrs[el.dataset.k]){delete pdErrs[el.dataset.k];const e=$("e-"+el.dataset.k);if(e)e.textContent="";el.removeAttribute("aria-invalid")}
    if(el.dataset.k==="bio")$("bioCnt").textContent=el.value.length+"/400";markDirty()})});
  P.querySelectorAll("[data-arr]").forEach(cb=>cb.addEventListener("change",()=>{const k=cb.dataset.arr,a=getK(k);
    if(cb.checked){if(!a.includes(cb.value))a.push(cb.value)}else a.splice(a.indexOf(cb.value),1);
    if(k==="roles")P.querySelectorAll("[data-show]").forEach(s=>{if(s.dataset.show==="pro")s.hidden=!has(pd.roles,"pro");if(s.dataset.show==="seeker")s.hidden=!has(pd.roles,"seeker")});
    markDirty()}));
  P.querySelectorAll("[data-tog]").forEach(cb=>cb.addEventListener("change",()=>{setK(cb.dataset.tog,cb.checked);
    if(cb.dataset.tog==="hasCo"){const box=P.querySelector('[data-show="co"]');box.hidden=!cb.checked;if(cb.checked)setTimeout(()=>{const c=P.querySelector(".cocard");if(c)scrollToEl(c,"start")},60)}markDirty()}));
  const photo=f=>compressImg(f,480,d=>{pd.photo=d;markDirty();renderProfile()});
  ["p-cam","p-gal"].forEach(id=>$(id).addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)photo(f)}));
  if($("p-rmphoto"))$("p-rmphoto").onclick=()=>{pd.photo="";markDirty();renderProfile()};
  if($("p-logo"))$("p-logo").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)compressImg(f,360,d=>{pd.co.logo=d;markDirty();renderProfile()})});
  if($("p-rmlogo"))$("p-rmlogo").onclick=()=>{pd.co.logo="";markDirty();renderProfile()};
  if($("p-cv"))$("p-cv").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)uploadCv(f,()=>renderProfile())});
  if($("p-rmcv"))$("p-rmcv").onclick=()=>{removeCv();renderProfile()};
  P.querySelectorAll("[data-sso]").forEach(b=>b.onclick=()=>openSso(b.dataset.sso));
  if($("p-unlink"))$("p-unlink").onclick=()=>{const n=SSO_NAMES[st.profile.auth?st.profile.auth.provider:pd.auth.provider];st.profile.auth=null;pd.auth=null;save();renderProfile();toast(t("ssoUnlinked",{p:n}))};
  $("p-save").onclick=saveProfile;$("p-prev").onclick=()=>openMyProfile(pd);
  if($("p-del"))$("p-del").onclick=()=>{pdConfirmDel=true;renderProfile();$("p-delyes").focus()};
  if($("p-delno"))$("p-delno").onclick=()=>{pdConfirmDel=false;renderProfile()};
  if($("p-delyes"))$("p-delyes").onclick=()=>{st.profile=prClone(PR_EMPTY);pd=prClone(PR_EMPTY);pdErrs={};pdDirty=false;pdConfirmDel=false;save();syncMe();renderProfile();renderAll();toast(t("tDeleted"))};
  [...P.querySelectorAll("input,select,textarea")].forEach(el=>{if(!el.id)return});

/* CV storage: file in IndexedDB, metadata in the profile */
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{try{const r=indexedDB.open("job-swipe",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction("files","readwrite");tx.objectStore("files").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async del(k){const d=await this.open();return new Promise(res=>{const tx=d.transaction("files","readwrite");tx.objectStore("files").delete(k);tx.oncomplete=res;tx.onerror=res})}};
const fmtSize=b=>b>=1048576?(b/1048576).toLocaleString(loc(),{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(b/1024))+" KB";
function cvMeta(p){return [p.cvSize?fmtSize(p.cvSize):"",p.cvDate?t("cvUploaded",{d:fdate(p.cvDate)}):""].filter(Boolean).join(" · ")}
function uploadCv(f,done){const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
  if(!isPdf){toast(t("cvOnlyPdf"));return}if(f.size>5*1024*1024){toast(t("cvTooBig"));return}
  const meta={cvName:f.name,cvSize:f.size,cvDate:"2026-11-05"};
  const apply=ok=>{Object.assign(st.profile,meta);Object.assign(pd,meta);save();toast(ok?t("tCvSaved"):t("cvStoreFail"));done&&done();renderApps()};
  IDB.put("cv",f).then(()=>apply(true)).catch(()=>apply(false))}
function removeCv(){["cvName","cvSize","cvDate"].forEach(k=>{st.profile[k]=k==="cvSize"?0:"";pd[k]=st.profile[k]});save();IDB.del("cv").catch(()=>{});toast(t("tCvRemoved"));renderApps()}
const SSO_NAMES={google:"Google",facebook:"Facebook",apple:"Apple"};
const KEYSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg>';

      if(inv&&a){const dt=dateOpts()[2+hashN(x.id)%4][0],hr=["09:00","10:30","13:00","15:30"][hashN(x.id)%4];x.iv={date:dt,time:hr};

        sysMsg(d,"mInterview",{d:fmtDay(dt),h:hr});theirMsg(d,t("rInterview",{d:fmtDay(dt),h:hr}));notify("nInterview",{x:coOf(a).name,d:fmtDay(dt),h:hr},{chat:d.id})}}});

		offset++;
	}

	for (var i = 0; i < num.length - offset; i++) {

		return this.num[index];

		return this.num.length;

			for (var j = 0; j < e.getLength(); j++) {
